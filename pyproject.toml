[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-asyntai-ai-chatbot"
version = "1.0.0"
description = "Adds the Asyntai AI chat assistant to a Django site. It answers visitor questions from your own content, in more than 80 languages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asyntai", email = "hello@asyntai.com" }]
keywords = ["django", "chatbot", "ai", "ai-chatbot", "live-chat", "customer-support", "assistant", "widget"]
dependencies = ["Django>=4.2"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://asyntai.com"
Documentation = "https://asyntai.com/documentation/integrations/django/"
Source = "https://github.com/asyntai/django-asyntai-ai-chatbot"
Issues = "https://github.com/asyntai/django-asyntai-ai-chatbot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_asyntai = ["templates/django_asyntai/*.html"]
