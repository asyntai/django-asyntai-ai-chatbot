name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "4.2.*"
          - python: "3.12"
            django: "5.2.*"
          - python: "3.13"
            django: "6.1.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install "Django==${{ matrix.django }}"
      - run: PYTHONPATH=src:. python -m django test --settings=tests.settings
