<div class="asyntai-widget-config"
     data-asyntai-widget="{{ asyntai_widget_id }}"
     data-asyntai-src="{{ asyntai_script_url }}"
     style="display: none"></div>
<script>
    // Loads the Asyntai chat widget after the page has finished loading, so
    // the site draws first and page speed does not change. The two values
    // arrive on a data attribute, because Django escapes an attribute for us
    // and we then never write anything into the script.
    (function () {
        var config = document.querySelector('.asyntai-widget-config');
        if (!config) { return; }

        var widgetId = config.getAttribute('data-asyntai-widget') || '';
        var scriptUrl = config.getAttribute('data-asyntai-src') || '';
        if (!widgetId || scriptUrl.indexOf('https://') !== 0) { return; }

        var load = function () {
            if (document.querySelector('script[data-asyntai-id]')) { return; }

            var script = document.createElement('script');
            script.src = scriptUrl;
            script.async = true;
            script.setAttribute('data-asyntai-id', widgetId);
            document.head.appendChild(script);
        };

        if (document.readyState === 'complete') {
            load();
        } else {
            window.addEventListener('load', load);
        }
    }());
</script>
